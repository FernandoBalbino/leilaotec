services:
  - type: web
    name: leilaotec
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.ts
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://fernandobalbino.github.io
